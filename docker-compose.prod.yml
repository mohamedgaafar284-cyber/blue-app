# ============================================
# BluePrint Engineering Consultancy ERP
# Hardened Production Orchestration for Synology NAS & Private Servers
# ============================================

services:
  # ============================================
  # 0. One-Off Database Migration Runner
  # ============================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: builder
    container_name: blueprint-migrate-prod
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://blueprint:${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}@postgres:5432/blueprint?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blueprint-prod-network
    profiles:
      - tools
      - migration

  # ============================================
  # 1. Next.js Main Application (HARDENED)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: blueprint-app-prod
    restart: always
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://blueprint:${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}@postgres:5432/blueprint?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-blueprint_minio}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blueprint-prod-network
    volumes:
      - uploads_data:/app/uploads
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================
  # 2. PostgreSQL 16 Database (ISOLATED & HARDENED)
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: blueprint-postgres-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      POSTGRES_USER: blueprint
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      POSTGRES_DB: blueprint
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - blueprint-prod-network
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "4"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueprint -d blueprint"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # 3. Redis Cache & Queue (ISOLATED & SECURED)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: blueprint-redis-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_prod_data:/data
    networks:
      - blueprint-prod-network
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # 4. MinIO S3 High-Speed Local Storage (SECURED)
  # ============================================
  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: blueprint-minio-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-blueprint_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:9000:9000"  # Only internal/localhost access by default
      - "127.0.0.1:9001:9001"  # Only internal/localhost console access
    volumes:
      - minio_prod_data:/data
    networks:
      - blueprint-prod-network
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # 5. Automated Database Daily Backup
  # ============================================
  backup:
    image: postgres:16-alpine
    container_name: blueprint-backup-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - PGPASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
    volumes:
      - backup_prod_data:/backups
    command: >
      /bin/sh -c '
        echo "0 2 * * * pg_dump -U blueprint -h postgres -d blueprint -F c -f /backups/blueprint-db-$$(date +\\%Y\\%m\\%d-\\%H\\%M).dump" > /etc/crontabs/root && crond -f
      '
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blueprint-prod-network

  # ============================================
  # 6. WebSocket Chat Service
  # ============================================
  chat-service:
    build:
      context: .
      dockerfile: mini-services/chat-service/Dockerfile
    container_name: blueprint-chat-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "3003:3003"
    env_file: .env
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://blueprint:${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}@postgres:5432/blueprint?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - CORS_ORIGINS=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blueprint-prod-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

networks:
  blueprint-prod-network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  uploads_data:
    driver: local
  minio_prod_data:
    driver: local
  backup_prod_data:
    driver: local
